<html style="margin:0;padding:0;">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<div style="background-color:transparent;box-sizing:border-box;">
  <div id="pptx-app" style="width:100%;height:720px;position:relative;display:flex;flex-direction:column;background:#050912;color:#fff;font-family:Arial,sans-serif;overflow:hidden;border-radius:12px;border:1px solid rgba(255,255,255,.08);">
    <div style="height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#080d18;border-bottom:1px solid rgba(255,255,255,.08);gap:8px;">
      <div style="min-width:0;display:flex;align-items:center;gap:9px;">
        <div style="width:9px;height:9px;background:#3b82f6;flex-shrink:0;"></div>
        <div id="brand-text" style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Moon Studio — Khoa học tự nhiên 6</div>
      </div>
      <div style="display:flex;gap:7px;flex-shrink:0;align-items:center;">
        <button id="openFile" style="border:1px solid rgba(255,255,255,.12);background:#101827;color:#fff;height:34px;padding:0 12px;cursor:pointer;font-size:12px;border-radius:4px;">Mở file</button>
        <button id="zoomOut" class="ctrl-btn" style="border:1px solid rgba(255,255,255,.12);background:#101827;color:#fff;min-width:38px;height:34px;padding:0 11px;cursor:pointer;font-size:16px;border-radius:4px;">−</button>
        <button id="zoomReset" class="ctrl-btn" style="border:1px solid rgba(255,255,255,.12);background:#101827;color:#fff;height:34px;padding:0 11px;cursor:pointer;font-size:12px;border-radius:4px;">100%</button>
        <button id="zoomIn" class="ctrl-btn" style="border:1px solid rgba(255,255,255,.12);background:#101827;color:#fff;min-width:38px;height:34px;padding:0 11px;cursor:pointer;font-size:16px;border-radius:4px;">+</button>
        <button id="fullscreen" class="ctrl-btn" style="border:1px solid rgba(255,255,255,.12);background:#101827;color:#fff;min-width:38px;height:34px;padding:0 8px;cursor:pointer;border-radius:4px;display:flex;align-items:center;justify-content:center;" title="Toàn màn hình">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
        <input type="file" id="fileInput" accept=".pptx" style="display:none;">
      </div>
    </div>
    <div id="viewport" style="position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(45deg,rgba(255,255,255,.015) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.015) 75%);background-size:22px 22px;">
      <div id="stage" style="position:relative;width:94%;max-width:1200px;height:88%;display:flex;align-items:center;justify-content:center;transform-origin:center center;transition:transform .15s ease;">
        <svg id="slide" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;display:block;background:#fff;box-shadow:0 25px 80px rgba(0,0,0,.5);user-select:none;"></svg>
      </div>
      <div id="dropzone" style="position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:rgba(5,9,18,.92);z-index:8;cursor:pointer;">
        <div style="width:72px;height:72px;border:2px dashed rgba(59,130,246,.5);border-radius:16px;display:flex;align-items:center;justify-content:center;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
        </div>
        <div style="text-align:center;">
          <div style="font-family:'Pixelify Sans',monospace;font-size:20px;margin-bottom:6px;">Không tải được từ link</div>
          <div style="font-size:13px;color:#8b95a7;">Kéo thả file .pptx vào đây hoặc nhấn <strong style="color:#3b82f6;">Mở file</strong></div>
        </div>
        <div id="dropzone-status" style="font-size:12px;color:#5a6478;max-width:80%;text-align:center;"></div>
      </div>
      <div id="loading" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#050912;z-index:10;">
        <div id="loading-text" style="font-family:'Pixelify Sans',monospace;font-size:18px;color:#fff;">Đang tải PPTX</div>
      </div>
      <div id="error" style="position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:25px;text-align:center;background:#050912;z-index:20;">
        <div style="max-width:520px;padding:28px;border:1px solid rgba(255,255,255,.1);background:#0b1220;border-radius:10px;">
          <div style="font-family:'Pixelify Sans',monospace;font-size:21px;margin-bottom:12px;color:#f87171;">Không thể mở slide</div>
          <div id="errorMessage" style="color:#aeb8c8;font-size:14px;line-height:1.6;margin-bottom:18px;"></div>
          <button id="errorRetry" style="border:1px solid rgba(59,130,246,.5);background:#1d4ed8;color:#fff;height:36px;padding:0 20px;cursor:pointer;font-size:13px;font-weight:600;border-radius:4px;">Mở file từ máy</button>
        </div>
      </div>
      <div style="position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;align-items:center;gap:10px;z-index:5;">
        <button id="previous" style="width:42px;height:38px;border:1px solid rgba(255,255,255,.16);background:rgba(8,13,24,.92);color:#fff;cursor:pointer;font-size:15px;border-radius:4px;">◀</button>
        <div id="counter" style="min-width:75px;padding:8px 12px;text-align:center;background:rgba(8,13,24,.92);border:1px solid rgba(255,255,255,.12);font-family:'Pixelify Sans',monospace;font-size:13px;border-radius:4px;">0 / 0</div>
        <button id="next" style="width:42px;height:38px;border:1px solid rgba(255,255,255,.16);background:rgba(8,13,24,.92);color:#fff;cursor:pointer;font-size:15px;border-radius:4px;">▶</button>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  var s = document.createElement('style');
  s.textContent = [
    '.ctrl-btn:hover{background:#162033;border-color:rgba(59,130,246,.45)!important;}',
    '.ctrl-btn:active{transform:translateY(1px);}',
    '#dropzone.dragover{background:rgba(29,78,216,.15)!important;}',
    '@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}100%{content:""}}',
    '#loading-text::after{content:"";animation:dots 1.2s infinite steps(4);}',
    '#slide text{font-family:\'Pixelify Sans\',monospace;}'
  ].join('');
  document.head.appendChild(s);

  /* ===== KHI TRIỂN KHAI THỰC TẾ, ĐỔI THÀNH LINK CỦA BẠN ===== */
  var PPTX_URL = "https://p16-flow-file-sign.ibyteimg.com/tos-mya-i-u8dpqn1f20/aee97031d3cd4949bc7f148c828a61ef.pptx~tplv-0es2k971ck-image.image?rcl=20261008234744ADD098C7B6222F29B649&rk3s=8e244e95&rrcfp=935dee89&x-expires=1792079265&x-signature=OY%2Fhex9d0DNdaOP2FBpyKTsIWHM%3D";

  var RELS_NS = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  var EMU_PER_INCH = 914400, DPI = 96;
  var zip = null, slides = [], currentSlide = 0, zoom = 1;
  var $ = function(id){ return document.getElementById(id); };
  var svg = $('slide'), stage = $('stage');
  var SVGNS = 'http://www.w3.org/2000/svg';

  function emuToPx(v){ return (Number(v||0)/EMU_PER_INCH)*DPI; }
  function attr(node, name){ return node ? node.getAttribute(name) : null; }
  function attrR(node){ return node ? (node.getAttributeNS(RELS_NS,'id') || node.getAttribute('r:id') || node.getAttribute('id')) : null; }
  function embedR(node){ return node ? (node.getAttributeNS(RELS_NS,'embed') || node.getAttribute('r:embed')) : null; }
  function getXml(path){ var f = zip.file(path); return f ? f.async('text') : null; }
  function xmlDoc(text){ return new DOMParser().parseFromString(text,'application/xml'); }
  function byTag(node, name){ return node.getElementsByTagNameNS('*', name); }
  function mk(tag){ return document.createElementNS(SVGNS, tag); }

  function resolvePath(base, target){
    if(!target) return null;
    if(target.indexOf('http:')===0 || target.indexOf('https:')===0) return target;
    var parts = base.split('/'); parts.pop();
    var tp = target.split('/');
    for(var i=0;i<tp.length;i++){ if(tp[i]==='.') continue; if(tp[i]==='..') parts.pop(); else parts.push(tp[i]); }
    return parts.join('/');
  }

  function showLoading(msg){ $('loading-text').textContent = msg||'Đang tải PPTX'; $('loading').style.display='flex'; $('error').style.display='none'; $('dropzone').style.display='none'; }
  function hideLoading(){ $('loading').style.display='none'; }
  function showError(msg){ hideLoading(); $('errorMessage').textContent = msg; $('error').style.display='flex'; $('dropzone').style.display='none'; }
  function showDropzone(status){ hideLoading(); $('dropzone').style.display='flex'; $('dropzone-status').textContent = status||''; $('error').style.display='none'; }

  async function readPresentation(){
    var xml = await getXml('ppt/presentation.xml');
    if(!xml) throw new Error('Không tìm thấy presentation.xml.');
    var doc = xmlDoc(xml);
    var sldSz = byTag(doc,'sldSz')[0];
    if(sldSz){
      var cx = emuToPx(attr(sldSz,'cx')), cy = emuToPx(attr(sldSz,'cy'));
      if(cx && cy) svg.setAttribute('viewBox','0 0 '+cx+' '+cy);
    }
  }

  async function getSlidePaths(){
    var pxml = await getXml('ppt/presentation.xml');
    var rxml = await getXml('ppt/_rels/presentation.xml.rels');
    if(!pxml || !rxml) throw new Error('File PPTX bị hỏng.');
    var pdoc = xmlDoc(pxml), rdoc = xmlDoc(rxml);
    var rels = new Map();
    var rn = byTag(rdoc,'Relationship');
    for(var i=0;i<rn.length;i++){ rels.set(attr(rn[i],'Id'), attr(rn[i],'Target')); }
    var result = [];
    var lst = byTag(pdoc,'sldIdLst')[0];
    if(!lst) return result;
    var ch = lst.children;
    for(var j=0;j<ch.length;j++){
      var rid = attrR(ch[j]);
      var target = rels.get(rid);
      if(!target) continue;
      var path = target;
      if(path.indexOf('ppt/')!==0) path = 'ppt/'+path.replace(/^\/+/,'');
      result.push(path);
    }
    return result;
  }

  async function getSlideRels(slidePath){
    var parts = slidePath.split('/');
    var fname = parts.pop();
    var relPath = parts.join('/')+'/_rels/'+fname+'.rels';
    var xml = await getXml(relPath);
    if(!xml) return new Map();
    var doc = xmlDoc(xml);
    var map = new Map();
    var nodes = byTag(doc,'Relationship');
    for(var i=0;i<nodes.length;i++){ map.set(attr(nodes[i],'Id'), attr(nodes[i],'Target')); }
    return map;
  }

  function getTransform(shape){
    var xfrm = byTag(shape,'xfrm')[0];
    if(!xfrm) return {x:0,y:0,w:100,h:100};
    var off = byTag(xfrm,'off')[0], ext = byTag(xfrm,'ext')[0];
    return { x: emuToPx(attr(off,'x')), y: emuToPx(attr(off,'y')), w: emuToPx(attr(ext,'cx')), h: emuToPx(attr(ext,'cy')) };
  }

  function getFillColor(node){
    var solid = byTag(node,'solidFill')[0];
    if(!solid) return null;
    var srgb = byTag(solid,'srgbClr')[0];
    if(srgb) return '#'+(attr(srgb,'val')||'ffffff');
    var scheme = byTag(solid,'schemeClr')[0];
    if(scheme){
      var map = {tx1:'111111',bg1:'ffffff',tx2:'1f3864',bg2:'e7e6e6',accent1:'2e75b6',accent2:'ed7d31',accent3:'a5a5a5',accent4:'ffc000',accent5:'5b9bd5',accent6:'70ad47'};
      return map[attr(scheme,'val')] || '#333333';
    }
    return null;
  }

  function getBlipEmbed(node){
    var blipFill = byTag(node,'blipFill')[0];
    if(!blipFill) return null;
    var blip = byTag(blipFill,'blip')[0];
    if(!blip) return null;
    return embedR(blip);
  }

  async function embedImageAt(svgEl, embedId, relsMap, slidePath, x, y, w, h){
    var target = relsMap.get(embedId);
    if(!target) return;
    var imgPath = resolvePath(slidePath, target);
    if(!imgPath) return;
    var imgFile = zip.file(imgPath);
    if(!imgFile) return;
    var b64 = await imgFile.async('base64');
    var ext = imgPath.split('.').pop().toLowerCase();
    var mime = ext==='png'?'image/png':(ext==='jpg'||ext==='jpeg')?'image/jpeg':ext==='gif'?'image/gif':'image/png';
    var img = mk('image');
    img.setAttribute('x', x); img.setAttribute('y', y);
    img.setAttribute('width', w); img.setAttribute('height', h);
    img.setAttribute('href', 'data:'+mime+';base64,'+b64);
    img.setAttribute('preserveAspectRatio','none');
    svgEl.appendChild(img);
  }

  function getRunStyle(rPr){
    var sz = Number(attr(rPr,'sz'));
    var fontSize = sz ? sz/100 : 18;
    var color = '#111111';
    var c = getFillColor(rPr);
    if(c) color = c;
    return {size:fontSize, color:color, bold:attr(rPr,'b')==='1', italic:attr(rPr,'i')==='1'};
  }

  function renderTextShape(svgEl, shape, x, y, w, h){
    var txBody = byTag(shape,'txBody')[0];
    if(!txBody) return;
    var paragraphs = txBody.children;
    var curY = y;
    for(var pi=0; pi<paragraphs.length; pi++){
      var p = paragraphs[pi];
      if(p.localName !== 'p') continue;
      var runs = p.children;
      var maxSize = 18;
      var spans = [];
      for(var ri=0; ri<runs.length; ri++){
        var run = runs[ri];
        if(run.localName !== 'r') continue;
        var tEl = byTag(run,'t')[0];
        if(!tEl) continue;
        var txt = tEl.textContent || '';
        var rPr = byTag(run,'rPr')[0];
        var st = rPr ? getRunStyle(rPr) : {size:18,color:'#111111',bold:false,italic:false};
        maxSize = Math.max(maxSize, st.size);
        spans.push({text:txt, style:st});
      }
      if(!spans.length){ curY += maxSize*1.3; continue; }
      var lineH = maxSize * 1.3;
      var curX = x;
      for(var si=0; si<spans.length; si++){
        var sp = spans[si];
        if(!sp.text){ continue; }
        var t = mk('text');
        t.setAttribute('x', curX);
        t.setAttribute('y', curY + maxSize);
        t.setAttribute('font-size', sp.style.size);
        t.setAttribute('fill', sp.style.color);
        if(sp.style.bold) t.setAttribute('font-weight','700');
        if(sp.style.italic) t.setAttribute('font-style','italic');
        t.textContent = sp.text;
        svgEl.appendChild(t);
        curX += sp.text.length * sp.style.size * 0.55;
      }
      curY += lineH;
    }
  }

  function getLineProps(shape){
    var ln = byTag(shape,'ln')[0];
    if(!ln) return null;
    var wAttr = attr(ln,'w');
    var w = wAttr ? Math.max(1, emuToPx(wAttr)) : 1;
    var color = getFillColor(ln);
    return {w:w, color:color || '#000000'};
  }

  function getRoundRectAdj(shape){
    var avLst = byTag(shape,'avLst')[0];
    if(!avLst) return null;
    var gds = byTag(avLst,'gd');
    for(var i=0;i<gds.length;i++){
      if(attr(gds[i],'name')==='adj'){
        var fmla = attr(gds[i],'fmla') || '';
        var m = fmla.match(/val\s+(\d+)/);
        if(m) return Number(m[1]);
      }
    }
    return null;
  }

  async function renderShape(svgEl, shape, relsMap, slidePath){
    var pos = getTransform(shape);
    var spPr = shape;
    /* check blipFill (image fill) first */
    var embed = getBlipEmbed(shape);
    if(embed){ await embedImageAt(svgEl, embed, relsMap, slidePath, pos.x, pos.y, pos.w, pos.h); return; }
    /* noFill? */
    var hasNoFill = byTag(shape,'noFill')[0];
    var fill = hasNoFill ? null : getFillColor(shape);
    var line = getLineProps(shape);
    var geom = byTag(shape,'prstGeom')[0];
    var geomType = geom ? attr(geom,'prst') : 'rect';
    var el;
    if(geomType === 'ellipse' || geomType === 'oval'){
      el = mk('ellipse');
      el.setAttribute('cx', pos.x + pos.w/2); el.setAttribute('cy', pos.y + pos.h/2);
      el.setAttribute('rx', pos.w/2); el.setAttribute('ry', pos.h/2);
    } else if(geomType === 'roundRect'){
      el = mk('rect');
      el.setAttribute('x', pos.x); el.setAttribute('y', pos.y);
      el.setAttribute('width', pos.w); el.setAttribute('height', pos.h);
      var adj = getRoundRectAdj(shape);
      var rx = adj ? Math.min(pos.w, pos.h) * adj / 100000 : Math.min(pos.w, pos.h) * 0.12;
      el.setAttribute('rx', rx); el.setAttribute('ry', rx);
    } else if(geomType === 'straightConnector1' || geomType.indexOf('Connector') >= 0){
      el = mk('line');
      el.setAttribute('x1', pos.x); el.setAttribute('y1', pos.y);
      el.setAttribute('x2', pos.x + pos.w); el.setAttribute('y2', pos.y + pos.h);
      if(line){ el.setAttribute('stroke', line.color); el.setAttribute('stroke-width', line.w); }
      else { el.setAttribute('stroke', '#000'); el.setAttribute('stroke-width', '1'); }
      svgEl.appendChild(el);
      return;
    } else {
      el = mk('rect');
      el.setAttribute('x', pos.x); el.setAttribute('y', pos.y);
      el.setAttribute('width', pos.w); el.setAttribute('height', pos.h);
    }
    el.setAttribute('fill', fill || 'none');
    if(line){ el.setAttribute('stroke', line.color); el.setAttribute('stroke-width', line.w); }
    svgEl.appendChild(el);
  }

  async function processShapes(svgEl, container, relsMap, slidePath){
    var children = container.children;
    for(var i=0; i<children.length; i++){
      var node = children[i];
      var ln = node.localName;
      if(ln === 'grpSp'){
        await processShapes(svgEl, node, relsMap, slidePath);
      } else if(ln === 'pic'){
        var pos = getTransform(node);
        var blip = byTag(node,'blip')[0];
        var embed = blip ? embedR(blip) : null;
        if(embed) await embedImageAt(svgEl, embed, relsMap, slidePath, pos.x, pos.y, pos.w, pos.h);
      } else if(ln === 'sp'){
        var hasText = byTag(node,'txBody')[0];
        if(hasText){
          var p2 = getTransform(node);
          var fill2 = getFillColor(node);
          var hasNo = byTag(node,'noFill')[0];
          if(fill2 && !hasNo){
            var r = mk('rect');
            r.setAttribute('x', p2.x); r.setAttribute('y', p2.y);
            r.setAttribute('width', p2.w); r.setAttribute('height', p2.h);
            r.setAttribute('fill', fill2);
            var geom2 = byTag(node,'prstGeom')[0];
            if(geom2 && attr(geom2,'prst')==='roundRect'){
              var adj2 = getRoundRectAdj(node);
              var rx2 = adj2 ? Math.min(p2.w,p2.h)*adj2/100000 : Math.min(p2.w,p2.h)*0.12;
              r.setAttribute('rx', rx2); r.setAttribute('ry', rx2);
            }
            svgEl.appendChild(r);
          }
          renderTextShape(svgEl, node, p2.x+10, p2.y+6, p2.w, p2.h);
        } else {
          await renderShape(svgEl, node, relsMap, slidePath);
        }
      }
    }
  }

  async function renderSlide(slidePath){
    var xml = await getXml(slidePath);
    if(!xml) throw new Error('Không đọc được slide.');
    var doc = xmlDoc(xml);
    var relsMap = await getSlideRels(slidePath);
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    var bg = byTag(doc,'bg')[0];
    var bgColor = '#ffffff';
    if(bg){ var c = getFillColor(bg); if(c) bgColor = c; }
    var root = mk('rect');
    root.setAttribute('x',0); root.setAttribute('y',0);
    root.setAttribute('width','100%'); root.setAttribute('height','100%');
    root.setAttribute('fill', bgColor);
    svg.appendChild(root);
    var spTree = byTag(doc,'spTree')[0];
    if(spTree) await processShapes(svg, spTree, relsMap, slidePath);
  }

  var renderLock = false;
  async function showSlide(index){
    if(!slides.length || renderLock) return;
    renderLock = true;
    currentSlide = Math.max(0, Math.min(slides.length-1, index));
    try { await renderSlide(slides[currentSlide]); $('counter').textContent = (currentSlide+1)+' / '+slides.length; }
    catch(e){ console.error(e); }
    renderLock = false;
  }

  async function loadFromBuffer(buffer, filename){
    try {
      showLoading('Đang giải nén PPTX');
      zip = await JSZip.loadAsync(buffer);
      await readPresentation();
      slides = await getSlidePaths();
      if(!slides.length) throw new Error('Không tìm thấy slide nào.');
      if(filename) $('brand-text').textContent = 'Moon Studio — ' + filename.replace(/\.pptx$/i,'');
      currentSlide = 0; zoom = 1; stage.style.transform = 'scale(1)'; $('zoomReset').textContent = '100%';
      await showSlide(0);
      hideLoading();
      $('dropzone').style.display = 'none';
    } catch(err){
      console.error(err);
      showError(err.message || 'Có lỗi khi đọc file PPTX.');
    }
  }

  async function loadFromUrl(){
    try {
      showLoading('Đang tải từ link');
      var res = await fetch(PPTX_URL, {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status+' — Không tải được file.');
      var buf = await res.arrayBuffer();
      await loadFromBuffer(buf, 'khoahoctunhien6.pptx');
    } catch(err){
      console.error(err);
      showDropzone(err.message || 'Không tải được. Hãy mở file từ máy.');
    }
  }

  $('openFile').addEventListener('click', function(){ $('fileInput').click(); });
  $('errorRetry').addEventListener('click', function(){ $('fileInput').click(); });
  $('fileInput').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    if(!/\.pptx$/i.test(file.name)){ showError('Vui lòng chọn file .pptx'); return; }
    var reader = new FileReader();
    reader.onload = function(ev){ loadFromBuffer(ev.target.result, file.name); };
    reader.readAsArrayBuffer(file);
  });

  var dz = $('dropzone');
  dz.addEventListener('click', function(){ $('fileInput').click(); });
  ['dragenter','dragover'].forEach(function(ev){ $('viewport').addEventListener(ev, function(e){ e.preventDefault(); dz.classList.add('dragover'); }); });
  ['dragleave','drop'].forEach(function(ev){ $('viewport').addEventListener(ev, function(e){ e.preventDefault(); dz.classList.remove('dragover'); }); });
  $('viewport').addEventListener('drop', function(e){
    var file = e.dataTransfer.files[0];
    if(!file) return;
    if(!/\.pptx$/i.test(file.name)){ showError('Vui lòng kéo thả file .pptx'); return; }
    var reader = new FileReader();
    reader.onload = function(ev){ loadFromBuffer(ev.target.result, file.name); };
    reader.readAsArrayBuffer(file);
  });

  $('previous').addEventListener('click', function(){ showSlide(currentSlide-1); });
  $('next').addEventListener('click', function(){ showSlide(currentSlide+1); });

  document.addEventListener('keydown', function(e){
    if(e.key==='ArrowLeft') showSlide(currentSlide-1);
    if(e.key==='ArrowRight' || e.key===' '){ e.preventDefault(); showSlide(currentSlide+1); }
    if(e.key==='Escape' && document.fullscreenElement) document.exitFullscreen();
  });

  var touchX = 0;
  $('viewport').addEventListener('touchstart', function(e){ touchX = e.touches[0].clientX; }, {passive:true});
  $('viewport').addEventListener('touchend', function(e){
    var dx = e.changedTouches[0].clientX - touchX;
    if(Math.abs(dx) > 50){ if(dx<0) showSlide(currentSlide+1); else showSlide(currentSlide-1); }
  }, {passive:true});

  function applyZoom(){ stage.style.transform = 'scale('+zoom+')'; $('zoomReset').textContent = Math.round(zoom*100)+'%'; }
  $('zoomIn').addEventListener('click', function(){ zoom = Math.min(1.8, zoom+0.1); applyZoom(); });
  $('zoomOut').addEventListener('click', function(){ zoom = Math.max(0.4, zoom-0.1); applyZoom(); });
  $('zoomReset').addEventListener('click', function(){ zoom = 1; applyZoom(); });

  $('fullscreen').addEventListener('click', async function(){
    try {
      var app = $('pptx-app');
      if(!document.fullscreenElement){ if(app.requestFullscreen) await app.requestFullscreen(); }
      else { await document.exitFullscreen(); }
    } catch(e){ console.error(e); }
  });

  showLoading('Đang tải PPTX');
  loadFromUrl();
})();
</script>
</html>
